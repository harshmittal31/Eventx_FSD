<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title description">
  <title id="title">EventX architecture and data-flow</title>
  <desc id="description">Architecture diagram showing browser users, React and Vite frontend, Express API with authentication and role middleware, backend workflow modules, MySQL database, and seat-lock expiry processing.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2878b5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16836b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf7623"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52657a; }
      .lane-title { font-size: 20px; font-weight: 700; }
      .box-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #41566f; }
      .lane { fill: #f6f9fc; stroke: #bdcbd9; stroke-width: 2; rx: 18; }
      .card { fill: #ffffff; stroke: #8ca4bc; stroke-width: 1.7; rx: 12; }
      .front { fill: #e8f3ff; stroke: #4b8fc7; stroke-width: 2; rx: 12; }
      .api { fill: #edf2ff; stroke: #647ac8; stroke-width: 2; rx: 12; }
      .domain { fill: #eaf8f3; stroke: #4b9b81; stroke-width: 1.7; rx: 12; }
      .db { fill: #fff5e8; stroke: #d58a32; stroke-width: 2; rx: 12; }
      .worker { fill: #fff0ef; stroke: #c7655e; stroke-width: 1.7; rx: 12; }
      .arrow { fill: none; stroke: #2878b5; stroke-width: 3; marker-end: url(#arrow-blue); }
      .db-arrow { fill: none; stroke: #16836b; stroke-width: 3; marker-end: url(#arrow-green); }
      .worker-arrow { fill: none; stroke: #cf7623; stroke-width: 3; marker-end: url(#arrow-orange); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1800" height="1280" fill="#ffffff"/>
  <text x="54" y="58" class="title">EventX | application architecture and data flow</text>
  <text x="54" y="88" class="subtitle">React/Vite browser client → Express API → transactional MySQL workflows</text>

  <!-- Swim lanes -->
  <rect x="45" y="118" width="245" height="1040" class="lane"/>
  <rect x="315" y="118" width="330" height="1040" class="lane"/>
  <rect x="670" y="118" width="390" height="1040" class="lane"/>
  <rect x="1085" y="118" width="390" height="1040" class="lane"/>
  <rect x="1500" y="118" width="255" height="1040" class="lane"/>
  <text x="70" y="153" class="lane-title">People</text>
  <text x="340" y="153" class="lane-title">Browser client</text>
  <text x="695" y="153" class="lane-title">HTTP API</text>
  <text x="1110" y="153" class="lane-title">Business workflows</text>
  <text x="1525" y="153" class="lane-title">MySQL</text>

  <!-- People -->
  <rect x="70" y="205" width="195" height="130" class="front"/>
  <text x="90" y="237" class="box-title">Customer</text>
  <text x="90" y="265" class="body">Discover events</text>
  <text x="90" y="287" class="body">Book seats / transfer</text>
  <text x="90" y="309" class="body">View tickets / waitlist</text>

  <rect x="70" y="375" width="195" height="125" class="front"/>
  <text x="90" y="407" class="box-title">Staff</text>
  <text x="90" y="435" class="body">Manage events</text>
  <text x="90" y="457" class="body">Promote waitlist</text>
  <text x="90" y="479" class="body">Scan tickets</text>

  <rect x="70" y="540" width="195" height="125" class="front"/>
  <text x="90" y="572" class="box-title">Administrator</text>
  <text x="90" y="600" class="body">All staff workflows</text>
  <text x="90" y="622" class="body">Users, roles, refunds</text>

  <rect x="70" y="735" width="195" height="176" class="card"/>
  <text x="90" y="768" class="box-title">External systems</text>
  <text x="90" y="800" class="body">No payment gateway</text>
  <text x="90" y="824" class="body">No email provider</text>
  <text x="90" y="848" class="body">No message broker</text>
  <text x="90" y="884" class="small">Refunds are status records</text>

  <!-- Frontend -->
  <rect x="340" y="205" width="280" height="235" class="front"/>
  <text x="362" y="239" class="box-title">React 19 + Vite</text>
  <text x="362" y="271" class="body">App.jsx</text>
  <text x="378" y="294" class="small">Events, account, seat map, checkout</text>
  <text x="362" y="325" class="body">StaffDashboard.jsx</text>
  <text x="378" y="348" class="small">Event admin and QR scanner</text>
  <text x="362" y="379" class="body">AdminRefundPanel.jsx</text>
  <text x="378" y="402" class="small">Refund status administration</text>

  <rect x="340" y="475" width="280" height="170" class="card"/>
  <text x="362" y="509" class="box-title">Browser state</text>
  <text x="362" y="540" class="body">JWT and user → localStorage</text>
  <text x="362" y="565" class="body">Bearer token on protected calls</text>
  <text x="362" y="590" class="body">JSON request / response</text>
  <text x="362" y="619" class="small">API origin currently localhost:5000</text>

  <rect x="340" y="700" width="280" height="158" class="card"/>
  <text x="362" y="734" class="box-title">Client actions</text>
  <text x="362" y="765" class="body">Browse → select → lock seats</text>
  <text x="362" y="790" class="body">Confirm → display bookings / QR</text>
  <text x="362" y="815" class="body">Staff camera scan → verify</text>
  <text x="362" y="840" class="small">HTML5 QR scanner</text>

  <!-- API layer -->
  <rect x="695" y="205" width="340" height="150" class="api"/>
  <text x="718" y="239" class="box-title">Express application</text>
  <text x="718" y="270" class="body">CORS + JSON parser + health route</text>
  <text x="718" y="296" class="body">Route modules → controllers</text>
  <text x="718" y="322" class="small">backend/src/app.js | port 5000 default</text>

  <rect x="695" y="390" width="340" height="160" class="api"/>
  <text x="718" y="424" class="box-title">Authentication &amp; authorization</text>
  <text x="718" y="455" class="body">JWT verify → req.user</text>
  <text x="718" y="481" class="body">Role gates: CUSTOMER / STAFF / ADMIN</text>
  <text x="718" y="517" class="small">bcrypt password hashing; 2-hour JWT</text>

  <rect x="695" y="590" width="340" height="220" class="card"/>
  <text x="718" y="624" class="box-title">REST route groups</text>
  <text x="718" y="655" class="body">/auth  /events  /bookings  /tickets</text>
  <text x="718" y="681" class="body">/tickets/transfer  /waitlist</text>
  <text x="718" y="707" class="body">/customer  /notifications</text>
  <text x="718" y="733" class="body">/refunds  /admin</text>
  <text x="718" y="775" class="small">Public reads + protected mutations</text>

  <rect x="695" y="860" width="340" height="155" class="card"/>
  <text x="718" y="894" class="box-title">Common API behaviors</text>
  <text x="718" y="925" class="body">Validate input and ownership</text>
  <text x="718" y="951" class="body">Parameterized SQL, explicit errors</text>
  <text x="718" y="977" class="small">Transactions for coordinated writes</text>

  <!-- Domain services -->
  <rect x="1110" y="205" width="340" height="170" class="domain"/>
  <text x="1132" y="239" class="box-title">Identity &amp; event catalog</text>
  <text x="1132" y="270" class="body">Register / login / profile</text>
  <text x="1132" y="296" class="body">Create events + generated seat map</text>
  <text x="1132" y="322" class="body">Custom JSON layout and tier prices</text>
  <text x="1132" y="350" class="small">Event + seats commit together</text>

  <rect x="1110" y="405" width="340" height="205" class="domain"/>
  <text x="1132" y="439" class="box-title">Seat lock &amp; booking</text>
  <text x="1132" y="470" class="body">Lock AVAILABLE seat → HELD (5 min)</text>
  <text x="1132" y="496" class="body">Confirm ≤20 owned active lock IDs</text>
  <text x="1132" y="522" class="body">Create booking + booking seats + tickets</text>
  <text x="1132" y="548" class="body">Consume locks; mark seats BOOKED</text>
  <text x="1132" y="584" class="small">Atomic transaction; bounded lock retries</text>

  <rect x="1110" y="640" width="340" height="195" class="domain"/>
  <text x="1132" y="674" class="box-title">Cancellation &amp; waitlist</text>
  <text x="1132" y="705" class="body">Cancel own booking; release seats</text>
  <text x="1132" y="731" class="body">Promote earliest waiter to HELD</text>
  <text x="1132" y="757" class="body">NOTIFIED customer confirms the lock</text>
  <text x="1132" y="783" class="body">Expiry returns abandoned seat to pool</text>
  <text x="1132" y="812" class="small">Manual staff promotion also supported</text>

  <rect x="1110" y="865" width="340" height="205" class="domain"/>
  <text x="1132" y="899" class="box-title">Ticket &amp; customer/admin features</text>
  <text x="1132" y="930" class="body">Signed QR issue, verify, audit</text>
  <text x="1132" y="956" class="body">Transfer: PENDING → COMPLETED/REJECTED</text>
  <text x="1132" y="982" class="body">Wishlist, reviews, support, notices</text>
  <text x="1132" y="1008" class="body">Admin users, event cancellation, refunds</text>
  <text x="1132" y="1045" class="small">No payment or email provider integration</text>

  <!-- Database -->
  <rect x="1525" y="205" width="205" height="280" class="db"/>
  <text x="1545" y="239" class="box-title">MySQL</text>
  <text x="1545" y="273" class="body">users</text>
  <text x="1545" y="299" class="body">events → seats</text>
  <text x="1545" y="325" class="body">seat_locks</text>
  <text x="1545" y="351" class="body">bookings</text>
  <text x="1545" y="377" class="body">booking_seats</text>
  <text x="1545" y="403" class="body">tickets</text>
  <text x="1545" y="429" class="body">ticket_transfers</text>
  <text x="1545" y="463" class="small">InnoDB transactions + row locks</text>

  <rect x="1525" y="525" width="205" height="250" class="db"/>
  <text x="1545" y="559" class="box-title">Supporting tables</text>
  <text x="1545" y="593" class="body">waitlist</text>
  <text x="1545" y="619" class="body">event_notifications</text>
  <text x="1545" y="645" class="body">refund_requests</text>
  <text x="1545" y="671" class="body">ticket_verification_logs</text>
  <text x="1545" y="697" class="body">wishlist / reviews / support</text>
  <text x="1545" y="741" class="small">Baseline schema provisioned separately</text>

  <!-- Background job -->
  <rect x="1110" y="1100" width="620" height="78" class="worker"/>
  <text x="1132" y="1132" class="box-title">Seat-lock expiry task (same API process; every ~1 second)</text>
  <text x="1132" y="1158" class="body">ACTIVE + expired → EXPIRED; HELD seat → AVAILABLE if no valid active lock remains</text>

  <!-- Request / response flows -->
  <path d="M265 265 H340" class="arrow"/>
  <path d="M265 438 H305 V400 H340" class="arrow"/>
  <path d="M265 602 H305 V420 H340" class="arrow"/>
  <text x="276" y="250" class="small">actions</text>

  <path d="M620 300 H695" class="arrow"/>
  <path d="M620 530 H660 V470 H695" class="arrow"/>
  <text x="630" y="284" class="small">HTTP/JSON</text>
  <text x="630" y="516" class="small">Bearer JWT</text>

  <path d="M865 355 V390" class="arrow"/>
  <path d="M865 550 V590" class="arrow"/>
  <path d="M1035 700 H1110" class="arrow"/>
  <text x="1043" y="685" class="small">authorized request</text>

  <!-- Domain persistence links -->
  <path d="M1450 287 H1525" class="db-arrow"/>
  <path d="M1450 500 H1480 V345 H1525" class="db-arrow"/>
  <path d="M1450 737 H1480 V645 H1525" class="db-arrow"/>
  <path d="M1450 965 H1490 V445 H1525" class="db-arrow"/>
  <text x="1460" y="272" class="small">SQL</text>

  <!-- Expiry loop -->
  <path d="M1415 1100 V1060 H1490 V405 H1525" class="worker-arrow"/>
  <path d="M1525 460 H1495 V1080 H1415" class="worker-arrow dashed"/>
  <text x="1498" y="1024" class="small">scan / release</text>

  <!-- Browser response -->
  <path d="M1110 332 H1070 V1100 H660 V340 H620" class="arrow dashed"/>
  <text x="735" y="1080" class="small">JSON response / updated UI state</text>

  <!-- Legend -->
  <line x1="70" y1="1214" x2="120" y2="1214" class="arrow"/>
  <text x="132" y="1220" class="small">request / response</text>
  <line x1="340" y1="1214" x2="390" y2="1214" class="db-arrow"/>
  <text x="402" y="1220" class="small">database transaction</text>
  <line x1="650" y1="1214" x2="700" y2="1214" class="worker-arrow"/>
  <text x="712" y="1220" class="small">background expiry / release</text>
  <text x="1110" y="1220" class="small">Seat state: AVAILABLE → HELD → BOOKED (or HELD → AVAILABLE on expiry)</text>
</svg>
